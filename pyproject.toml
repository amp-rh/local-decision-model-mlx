[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-decision-model-mlx"
version = "0.1.0"
description = "Train your own Jev-style decision classifier fully locally on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["structlog>=25"]

[project.optional-dependencies]
data = ["datasets>=2.19"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "black>=24.1",
    "isort>=5.13",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_decision_model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["local_decision_model"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]  # S = security (bandit-equivalent rules)

[tool.ruff.lint.per-file-ignores]
# Tests exercise synthetic data generators with fixed seeds
"tests/*" = ["S101", "S311"]
# Synthetic data generation: pseudo-random is correct, not crypto
"src/local_decision_model/build_dataset.py" = ["S311"]
# Eval client always POSTs to the local server (see THREAT_MODEL.md T3)
"src/local_decision_model/evaluate.py" = ["S310"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
# Documented in THREAT_MODEL.md:
# B615: HF dataset repos are canonical, public, seeded reads (T2); B310/B311:
# eval client only talks to localhost:8080 (T3); rng is data generation, not crypto.
skips = ["B615", "B310", "B311"]
